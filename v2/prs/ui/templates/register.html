{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Register patient</h2>
  <p class="muted">The Patient ID is created automatically.</p>
  <form method="post">
    <label>Name <input name="name" value="{{ request.form.get('name', '') }}" required></label>
    <label>Date of birth <input name="date_of_birth" type="date" value="{{ request.form.get('date_of_birth', '') }}" required></label>
    <label>Phone <input name="phone" value="{{ request.form.get('phone', '') }}"></label>
    <label>Address <input name="address" value="{{ request.form.get('address', '') }}"></label>
    <label>Emergency contact <input name="emergency_contact" value="{{ request.form.get('emergency_contact', '') }}"></label>
    <button type="submit">Register</button>
  </form>
</div>
{% endblock %}
