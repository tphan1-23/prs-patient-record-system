{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Find a patient by ID</h2>
  <form method="get" action="{{ url_for('prs.search') }}">
    <label>Patient ID <input name="patient_id" placeholder="PRS-XXXXXXXX" required></label>
    <button type="submit">Search</button>
  </form>
</div>
<div class="card">
  <a href="{{ url_for('prs.register') }}">Register a new patient</a>
</div>
{% endblock %}
